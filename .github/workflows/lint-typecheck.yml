name: Lint and Type Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-typecheck:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff is pinned in requirements.txt (ruff==0.14.5), so it is already
          # installed above. Do not add a bare `pip install ruff` here: it
          # upgrades past the pin, and with `preview = true` in .ruff.toml a
          # newer release adds diagnostics the pinned version never reports.

      - name: Run Ruff
        run: |
          ruff check

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Pyright
        run: |
          npx pyright
